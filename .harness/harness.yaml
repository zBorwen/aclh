version: "1.1"

# Select exactly one preset as the source of active plugins.
preset: "full-lifecycle"

# Project assets are retrieval candidates. P2 no longer loads all of them into
# every task context. `context-select.ts` chooses task-relevant slices.
project_assets:
  profile: true
  architecture: true
  dev-notes: true
  bug-ledger: true
  decisions: true
  gotchas: true
context_selector: ".harness/scripts/context-select.ts"
governance: ".harness/governance.yaml"

# Preset definitions. `project` lists allowed retrieval sources for the preset;
# it does not mean eager/full-file context loading.
presets:
  full-lifecycle:
    description: "正式业务项目开发（需求→交付）"
    rules: [naming-frontend, react-patterns, typescript-strict]
    process: [tdd-workflow, full-lifecycle, pr-review]
    templates: [task-tdd, bug-entry, spec]
    project: [profile, architecture, dev-notes, bug-ledger, decisions, gotchas]
  testing-only:
    description: "老项目补测试、提升 Sonar 分数"
    rules: [typescript-strict]
    process: [testing-only]
    templates: [task-tdd]
    project: [profile, architecture, gotchas]
  maintenance:
    description: "长期维护、Bug 修复"
    rules: [naming-frontend, typescript-strict]
    process: [pr-review]
    templates: [bug-entry]
    project: [profile, bug-ledger, gotchas, dev-notes]
  quick-start:
    description: "新项目初始化，最小配置"
    rules: [naming-frontend]
    process: []
    templates: []
    project: [profile]
