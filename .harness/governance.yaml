version: "1.3"

# P2 risk-based governance. Higher levels only add constraints; they never weaken
# lower-level deterministic machine checks.
risk_levels:
  L0:
    name: trivial
    description: "机械性、低影响变更；最小机器门禁"
    required_gates: [check]
    context_required: false
    builder_self_review: false
    independent_review: none
  L1:
    name: low-risk
    description: "局部低风险代码变更；完整机器验证 + 独立 review"
    required_gates: [check, typecheck, test]
    context_required: true
    builder_self_review: false
    independent_review: codex-or-human
  L2:
    name: normal
    description: "默认业务开发；完整机器验证 + 独立 review + 用户决定是否 Repair"
    required_gates: [check, typecheck, test]
    context_required: true
    builder_self_review: false
    independent_review: codex-or-human
  L3:
    name: high-risk
    description: "高风险/跨边界变更；完整门禁 + 人工独立 review + 用户决定是否 Repair"
    required_gates: [check, typecheck, test]
    context_required: true
    builder_self_review: false
    independent_review: human

default_risk_level: L2

# Verification is task-dependent. TDD is one strategy, not a universal ritual.
verification_strategies:
  tdd:
    description: "业务逻辑/缺陷修复：RED → GREEN → REFACTOR"
    required_markers: [RED, GREEN, REFACTOR]
  component:
    description: "UI/组件：component test + interaction/smoke verification"
    required_markers: [COMPONENT_TEST, INTERACTION_CHECK]
  config:
    description: "配置/基础设施：schema validation + smoke verification"
    required_markers: [SCHEMA_VALIDATION, SMOKE_TEST]
  migration:
    description: "迁移/兼容性：before/after compatibility + rollback check"
    required_markers: [COMPATIBILITY_CHECK, ROLLBACK_CHECK]
  docs:
    description: "文档：structure/link/example validation"
    required_markers: [DOC_STRUCTURE, LINK_OR_EXAMPLE_CHECK]

default_verification_strategy: tdd

# Metadata retrieval is bounded so project knowledge can grow without being
# injected wholesale into every Codex context. Admission requires at least one
# Scope relevance match; severity can only increase rank after admission.
knowledge_retrieval:
  max_items_per_source: 5
  scoring:
    minimum_scope_matches: 1
    module_match: 5
    file_match: 4
    tag_match: 3
    high_severity_bonus: 2
