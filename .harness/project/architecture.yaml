# 项目架构定义
modules:
  - name: "Governance Runtime"
    path: ".harness/scripts"
    responsibility: "Own task state transitions, Context, Evidence, review, and delivery validation."
    depends_on: []
  - name: "Codex Adapter"
    path: ".agents/skills/aclh-task"
    responsibility: "Orchestrate the repository-owned ACLH lifecycle for explicit Codex invocation."
    depends_on: ["Governance Runtime"]
  - name: "External Codex Integration"
    path: ".harness/integrations/codex"
    responsibility: "Provide the thin Codex integration copied into an external consumer repository."
    depends_on: ["Governance Runtime"]
  - name: "Runtime Verification"
    path: "tests"
    responsibility: "Verify embedded and external ACLH lifecycle contracts and trust boundaries."
    depends_on: ["Governance Runtime", "Codex Adapter", "External Codex Integration"]

boundaries:
  rules:
    - "Adapters orchestrate Engine-owned Runtime commands and do not manufacture trusted PASS state."
    - "External consumer source and task state remain in the consumer repository; Runtime contracts remain in the Engine."
  dependency_direction:
    - "Codex Adapter -> Governance Runtime"
    - "External Codex Integration -> Governance Runtime"
    - "Runtime Verification -> governed modules"
