plugin:
  name: pr-review
  type: process
  version: 1.0.0
  description: Pull Request 审查流程 (PR Review Process)
  tags:
    - process
    - review
    - github

workflow:
  checklist:
    - tests pass # 所有测试必须通过
    - lint pass # 代码格式和静态检查通过
    - no console.log # 代码中不得遗留调试用的 console.log
    - no TODO without ticket # 所有的 TODO 注释必须附带关联的工单号
    - changelog updated # 必须更新相应的变更日志
    - breaking changes documented # 破坏性更新必须在文档中明确标出

  checks:
    - type: grep-pattern
      description: 检查是否遗留了 console.log
      target: "src/**/*.{ts,tsx}"
      pattern: "console\\.log"
      severity: warning
    - type: grep-pattern
      description: 检查是否有没有关联工单号的 TODO
      target: "src/**/*.{ts,tsx}"
      pattern: "TODO(?!.*JIRA|.*#)"
      severity: warning
