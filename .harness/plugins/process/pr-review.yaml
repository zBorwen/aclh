plugin:
  name: pr-review
  type: process
  version: 1.0.0
  description: Pull Request 审查流程 (PR Review Process)
  tags:
    - process
    - review
    - github

workflow:
  # Checklist items are advisory until backed by executable evidence.
  checklist:
    - tests pass
    - lint pass
    - no console.log
    - no TODO without ticket
    - changelog updated
    - breaking changes documented

  checks:
    - id: pr-console-log
      type: grep-pattern
      enforcement: verifiable
      description: 检查是否遗留了 console.log
      target: "src/**/*.{ts,tsx}"
      pattern: "console\\.log"
      severity: warning
    - id: pr-todo-ticket
      type: grep-pattern
      enforcement: verifiable
      description: 检查是否有没有关联工单号的 TODO
      target: "src/**/*.{ts,tsx}"
      pattern: "TODO(?!.*JIRA|.*#)"
      severity: warning
