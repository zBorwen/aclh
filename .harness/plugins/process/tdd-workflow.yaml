plugin:
  name: tdd-workflow
  type: process
  version: 1.1.0
  description: 当 verification_strategy=tdd 时使用的测试驱动开发循环
  tags: [process, tdd]

applicability:
  verification_strategy: tdd
  note: "P2 中 TDD 不再是所有任务的通用流程；仅对声明 tdd strategy 的任务生效。"

workflow:
  inner_loop:
    description: TDD 核心开发循环
    steps:
      - name: RED
        action: write failing test
        gate: test must fail for the RIGHT reason
      - name: GREEN
        action: write minimal implementation
        gate: must not modify tests merely to fit implementation
      - name: REFACTOR
        action: clean up only when useful
        gate: regression protection must not weaken

  feedback_protocol:
    description: 仅适用于 tdd strategy 的反馈修复协议
    steps:
      1: record feedback
      2: reproduce behavioral defect with a failing regression test when feasible
      3: confirm failure reason
      4: fix implementation
      5: rerun evidence and review gates
    rules:
      - MUST NOT fabricate a RED state with syntax/configuration errors
      - MUST record review rejection in changelog

non_tdd_redirect:
  component: "Use COMPONENT_TEST + INTERACTION_CHECK from test-plan.md"
  config: "Use SCHEMA_VALIDATION + SMOKE_TEST from test-plan.md"
  migration: "Use COMPATIBILITY_CHECK + ROLLBACK_CHECK from test-plan.md"
  docs: "Use DOC_STRUCTURE + LINK_OR_EXAMPLE_CHECK from test-plan.md"

required_before_implement:
  - generate relevant task context with context-select.ts when required by risk
  - consult retrieved bug/gotcha/decision items relevant to the task
