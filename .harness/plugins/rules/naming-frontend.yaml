plugin:
  name: naming-frontend
  type: rule
  version: 1.0.0
  description: 前端命名规范 (Frontend Naming Conventions)
  applies_to:
    - "**/*.tsx"
    - "**/*.ts"
    - "**/*.jsx"
    - "**/*.js"
    - "**/*.css"
    - "**/*.scss"
  tags:
    - frontend
    - react
    - naming

# Prose rules are advisory unless backed by an executable check below.
rules:
  file_naming:
    components: PascalCase
    hooks: camelCase, use prefix
    utils: camelCase
    styles: kebab-case
    tests: "{name}.test.{ext}"
    constants: UPPER_SNAKE_CASE
    pages: PascalCase
  variable_naming:
    variables: camelCase
    constants: UPPER_SNAKE_CASE
    functions: camelCase
    classes: PascalCase
    types: PascalCase, no I prefix
    interfaces: PascalCase, no I prefix
    enums: PascalCase
    enum_members: PascalCase
    css_classes: kebab-case BEM
    css_variables: --kebab-case
    data_attributes: kebab-case
  directory_naming:
    features: kebab-case
    components: PascalCase matching component

checks:
  - id: naming-001
    type: filename-pattern
    enforcement: blocking
    description: 检查组件文件名是否符合 PascalCase
    target: "src/components/**/*.tsx"
    pattern: "^[A-Z][a-zA-Z0-9]+$"
  - id: naming-002
    type: filename-pattern
    enforcement: blocking
    description: 检查 Hook 文件名
    target: "src/hooks/**/*.ts"
    pattern: "^use[A-Z][a-zA-Z0-9]+$"
  - id: naming-003
    type: filename-pattern
    enforcement: blocking
    description: 检查样式文件名
    target: "src/**/*.css"
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  - id: naming-eslint
    type: eslint-delegate
    enforcement: verifiable
    description: 使用 ESLint 检查变量命名规范
    rule: naming-convention
