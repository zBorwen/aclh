plugin:
  name: react-patterns
  type: rule
  version: 1.0.0
  description: React 设计模式与反模式 (React Design Patterns and Anti-Patterns)
  applies_to:
    - "**/*.tsx"
    - "**/*.jsx"
  tags:
    - react
    - architecture
    - patterns

# Design guidance remains advisory until an executable check can verify it reliably.
rules:
  preferred_patterns:
    - custom hooks for logic extraction
    - composition over inheritance
    - controlled components
    - error boundaries
    - React.memo for expensive renders
    - useCallback/useMemo judiciously
  prohibited_patterns:
    - direct DOM manipulation
    - inline styles for complex styling
    - prop drilling beyond 2 levels (use context/store)
    - useEffect for derived state (use useMemo)
    - setState in render
    - string refs
  state_management:
    - local state for UI-only state
    - Zustand for cross-component/persistent state
    - URL params for navigation state

checks:
  - id: react-hooks-rules
    type: eslint-delegate
    enforcement: verifiable
    rule: react-hooks/rules-of-hooks
  - id: react-hooks-deps
    type: eslint-delegate
    enforcement: verifiable
    rule: react-hooks/exhaustive-deps
  - id: react-no-direct-mutation
    type: eslint-delegate
    enforcement: verifiable
    rule: no-direct-mutation
