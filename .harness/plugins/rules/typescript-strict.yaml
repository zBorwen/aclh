plugin:
  name: typescript-strict
  type: rule
  version: 1.0.0
  description: TypeScript 严格模式规范 (TypeScript Strict Mode Rules)
  applies_to:
    - "**/*.ts"
    - "**/*.tsx"
  tags:
    - typescript
    - strict

# These prose rules are advisory until backed by executed compiler/linter evidence.
rules:
  compiler_requirements:
    - strict mode
    - noImplicitAny
    - strictNullChecks
    - noUnusedLocals
    - noUnusedParameters
  type_rules:
    - prefer interfaces for object shapes
    - use type for unions/intersections
    - no `any` (use `unknown`)
    - prefer `as const` for literals
    - use discriminated unions for state machines
    - never use `@ts-ignore` (use `@ts-expect-error` with comment)
  function_rules:
    - always type return values for exported functions
    - use generics instead of `any`
    - prefer `readonly` for immutable parameters
  import_rules:
    - use absolute imports with path aliases
    - barrel exports only at module boundary

checks:
  - id: ts-typecheck
    type: eslint-delegate
    enforcement: verifiable
    description: TypeScript compiler verification is delegated until command evidence is captured
    rule: tsc --noEmit
  - id: ts-no-explicit-any
    type: eslint-delegate
    enforcement: verifiable
    rule: "@typescript-eslint/no-explicit-any"
  - id: ts-no-unused-vars
    type: eslint-delegate
    enforcement: verifiable
    rule: "@typescript-eslint/no-unused-vars"
