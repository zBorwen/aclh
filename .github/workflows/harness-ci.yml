name: Harness CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run canonical gates and generate CI evidence
        run: node .harness/scripts/ci-evidence.ts

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-ci-evidence-${{ github.sha }}
          path: .harness/artifacts/ci-evidence.json
          if-no-files-found: error
          retention-days: 30
